name: Contributions

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 06:00 UTC
  push:
    branches: [main]
    paths:
      - ".github/workflows/contrib.yml"

permissions:
  contents: write

concurrency:
  group: contrib-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contrib:
    runs-on: ubuntu-latest
    steps:
      # Renders the contribution graph being eaten by a snake, light + dark
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#38bdf8

      # Isometric 3D contribution calendar (writes to ./profile-3d-contrib)
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Collect 3D calendar
        run: |
          cp profile-3d-contrib/profile-night-view.svg   dist/contrib-3d-dark.svg
          cp profile-3d-contrib/profile-green-animate.svg dist/contrib-3d-light.svg

      # Both land on the `output` branch so main history stays clean. One job
      # owns the branch: this action force-pushes build_dir as its whole content.
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
