name: Charts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/skills.json"
      - "assets/langmix.json"
      - "scripts/radar.py"
      - ".github/workflows/radar.yml"

permissions:
  contents: write

concurrency:
  group: charts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Hand-authored skill radar (edit assets/skills.json to change it)
      - name: Skill radar
        run: python scripts/radar.py --data assets/skills.json -o assets/radar

      # Hand-authored contract & language stack radar (edit assets/langmix.json)
      - name: Language radar
        run: python scripts/radar.py --data assets/langmix.json -o assets/radar-langs --values

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/radar-*.svg
          git diff --staged --quiet || git commit -m "chore: refresh charts"
          git push
