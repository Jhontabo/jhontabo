name: Charts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 06:00 UTC: refresh live GitHub data
  push:
    branches: [main]
    paths:
      - "assets/skills.json"
      - "scripts/radar.py"
      - "scripts/stats.py"
      - ".github/workflows/radar.yml"

permissions:
  contents: write

concurrency:
  group: charts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  radar:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Hand-authored skill radar (edit assets/skills.json to change it)
      - name: Skill radar
        run: python scripts/radar.py --data assets/skills.json -o assets/radar

      # Live language mix from public repos
      - name: Language radar
        run: >
          python scripts/radar.py --github jhontabo -o assets/radar-langs --values
          --exclude html,css,scss,shell,makefile,dockerfile,batchfile,blade

      # Live stats card (stars, repos, followers, contributions, streaks)
      - name: Stats card
        run: python scripts/stats.py --user jhontabo --out assets

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/radar-*.svg assets/stats-*.svg
          git diff --staged --quiet || git commit -m "chore: refresh charts"
          git push
