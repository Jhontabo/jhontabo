name: Banner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/source/**"
      - "scripts/banner/**"
      - ".github/workflows/banner.yml"

permissions:
  contents: write

jobs:
  banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install banner deps
        run: python -m pip install -r scripts/banner/requirements.txt

      - name: Generate animated banner
        run: python scripts/banner/generate.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/banner-*.svg scripts/banner/logos/*.png scripts/banner/data/*.npy
          git diff --staged --quiet || git commit -m "chore: refresh animated banner"
          git push
