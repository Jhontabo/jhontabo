name: Banner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/source/**"
      - "!assets/source/cutout.png"
      - "scripts/banner/generate.py"
      - "scripts/banner/static.py"
      - "scripts/banner/requirements.txt"
      - ".github/workflows/banner.yml"

permissions:
  contents: write

concurrency:
  group: banner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install banner deps
        run: python -m pip install -r scripts/banner/requirements.txt

      - name: Remove photo background (AI cutout)
        run: |
          python -m pip install "rembg[cpu]" onnxruntime Pillow
          python - <<'EOF'
          from pathlib import Path
          from PIL import Image
          src = None
          for c in ["assets/source/jhon.png", "assets/source/jhon.jpg",
                    "assets/source/github-profile.jpg", "assets/source/github-profile.png",
                    "assets/source/profile.jpg"]:
              if Path(c).exists():
                  src = c
                  break
          if src is None:
              print("no source photo, skipping cutout")
          else:
              try:
                  from rembg import remove
                  img = Image.open(src)
                  out = remove(img)
                  out.save("assets/source/cutout.png")
                  print(f"cutout saved from {src}")
              except Exception as e:
                  print(f"rembg failed ({e}), keeping original photo")
          EOF

      - name: Generate animated banner
        run: python scripts/banner/generate.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/banner-*.svg assets/source/cutout.png scripts/banner/logos/*.png scripts/banner/data/*.npy
          git diff --staged --quiet || git commit -m "chore: refresh animated banner"
          git push
